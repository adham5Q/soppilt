{% extends "base.html" %}{% block title %}{{ product.name }} | ShopPilot{% endblock %}{% block content %}
<div class="detail-layout"><div class="detail-image"><img src="{{ product.image }}" alt="{{ product.name }}" onerror="this.src='https://placehold.co/800x650?text=ShopPilot'"></div><div class="detail-copy"><span class="eyebrow">{{ product.category }}</span><h1>{{ product.name }}</h1><p>{{ product.description }}</p><div class="detail-price">EGP {{ "%.2f"|format(product.price) }}</div><p class="stock-note">{{ product.stock }} items available</p><form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}"><button class="btn btn-dark">Add to cart →</button></form><a class="text-link back-link" href="{{ url_for('products') }}">← Back to products</a></div></div>
{% endblock %}
